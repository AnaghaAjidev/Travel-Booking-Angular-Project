<!DOCTYPE html>
<html lang="en" ng-app="travelApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/fontawesome.css">
    <link rel="stylesheet" href="assets/css/templatemo-woox-travel.css">

    <script src="node_modules/angular/angular.min.js"></script>
    <script src="js/login.js"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background-image: url("assets/images/banner-02.jpg") !important;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        .login-box {
            width: 430px;
            background: rgba(255, 255, 255, 0.95);
            padding: 45px;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .35);
        }

        .login-box h2 {
            text-align: center;
            color: #22b3c1;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-control {
            border-radius: 30px;
            height: 50px;
        }

        .main-button button {
            width: 100%;
            border: none;
            border-radius: 30px;
            background: #22b3c1;
            color: white;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
        }

        .main-button button:hover {
            background: #178f9b;
        }

        .text-danger {
            font-size: 13px;
        }

        .bottom-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        .bottom-links a {
            color: #22b3c1;
            text-decoration: none;
        }

        label {
            color: #000 !important;
            font-weight: 600;
        }

        .mb-3 {
            color: #000 !important;
        }

        input[type="checkbox"] {
            accent-color: #22b3c1;
        }

        .mb-3 input[type="checkbox"]+text,
        .mb-3 {
            color: #000;
        }

        .remember {
            color: #000 !important;
            font-weight: 500;
        }

        .remember input {
            margin-right: 8px;
        }
    </style>

</head>

<body ng-controller="loginController">

    <div class="login-box">

        <h2>Travel Booking Portal</h2>

        <p>Login to continue your journey</p>

        <form name="loginForm" ng-submit="login()">

            <div class="mb-3">
                <label>Email</label>

                <input type="email" class="form-control" name="email" ng-model="user.email" required>

                <p class="text-danger" ng-show="loginForm.$submitted && loginForm.email.$error.required">
                    Email is required
                </p>

                <p class="text-danger" ng-show="loginForm.$submitted && loginForm.email.$error.email">
                    Enter a valid email
                </p>

            </div>

            <div class="mb-3">
                <label>Password</label>

                <input type="password" class="form-control" name="password" ng-model="user.password" ng-minlength="6"
                    required>

                <p class="text-danger" ng-show="loginForm.$submitted && loginForm.password.$error.required">
                    Password is required
                </p>

                <p class="text-danger" ng-show="loginForm.$submitted && loginForm.password.$error.minlength">
                    Minimum 6 characters
                </p>

            </div>

            <div class="mb-3">

                <label class="remember">
                    <input type="checkbox" ng-model="remember">
                    Remember Me
                </label>

            </div>

            <div class="main-button">

                <button type="submit">

                    Login

                </button>

            </div>

            <div class="bottom-links">
                <a href="register.html">Register</a>

            </div>

        </form>

    </div>

</body>

</html>
